[project]
name = "learn-cognitive-maintenance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yasirabd", email = "sir.yasirabd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
learn-cognitive-maintenance = "learn_cognitive_maintenance:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # starlette.testclient still uses the deprecated anyio.abc.BlockingPortal alias; not our code
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
