[project]
name = "learn-cognitive-maintenance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yasirabd", email = "sir.yasirabd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
plant-sim = "plant.sim:main"
plantctl = "plant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# top-level packages installed by `pip install git+https://github.com/RotoPower/learn-cognitive-maintenance`
packages = ["plant", "models"]
exclude = ["models/artifacts", "**/__pycache__"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # starlette.testclient still uses the deprecated anyio.abc.BlockingPortal alias; not our code
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
