# Production deploy (module D2.6). Staging deploys on every push to main through
# Workers Builds (docs/ci-cd.md); production ships only from a version tag, after a
# human approves the run in the `production` GitHub Environment. The Cloudflare token
# for production lives only in that environment's secrets, never on a PC.
name: production

on:
  push:
    tags: ["v*"]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything is tested before anyone is asked to approve; no secrets here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python tests
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Worker tests
        run: |
          for app in plant-api ingest scoring dashboard; do
            (cd "apps/$app" && npm ci && npm test) || exit 1
          done

  # One approval, then the Workers in dependency order: the plant API first (the others
  # bind to it), scoring before the dashboard (the dashboard binds to scoring).
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Production is provisioned
        run: |
          if grep -l "REPLACE_WITH_OUTPUT_OF" apps/*/wrangler.toml; then
            echo "::error::production D1 is not created yet: run 'wrangler d1 create plant-production' and put its id in the files above"
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::secret CLOUDFLARE_API_TOKEN missing in the production environment"; exit 1; }
      - name: plant-api (migrate D1, deploy)
        working-directory: apps/plant-api
        run: |
          npm ci
          npx wrangler d1 migrations apply plant-production --env production --remote
          npx wrangler deploy --env production
      - name: ingest
        working-directory: apps/ingest
        run: npm ci && npx wrangler deploy --env production
      - name: scoring
        working-directory: apps/scoring
        run: npm ci && npx wrangler deploy --env production
      - name: dashboard
        working-directory: apps/dashboard
        run: npm ci && npx wrangler deploy --env production
